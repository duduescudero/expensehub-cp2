name: expensehub-cp3
services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:?Configure RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: "${RABBIT_PASSWORD}"
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    image: ghcr.io/duduescudero/expensehub-cp2-web:${IMAGE_TAG:?Configure IMAGE_TAG}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ExpenseHub: "Data Source=/data/expensehub.db;Default Timeout=30"
      Bootstrap__Email: ${ADMIN_EMAIL:?Configure ADMIN_EMAIL}
      Bootstrap__Password: "${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD}"
      Rabbit__Host: rabbitmq
      Rabbit__User: ${RABBIT_USER}
      Rabbit__Password: "${RABBIT_PASSWORD}"
    ports:
      - "127.0.0.1:5187:8080"
    volumes:
      - database:/data
      - identity-keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      rabbitmq:
        condition: service_healthy
  worker:
    image: ghcr.io/duduescudero/expensehub-cp2-worker:${IMAGE_TAG:?Configure IMAGE_TAG}
    environment:
      ConnectionStrings__ExpenseHub: "Data Source=/data/expensehub.db;Default Timeout=30"
      Rabbit__Host: rabbitmq
      Rabbit__User: ${RABBIT_USER}
      Rabbit__Password: "${RABBIT_PASSWORD}"
    volumes:
      - database:/data
    depends_on:
      web:
        condition: service_started
volumes:
  database:
  rabbit-data:
  identity-keys:
